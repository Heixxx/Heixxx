name: generate arcade contribution graphs

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate contribution graph SVGs
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  github_token: ${{ secrets.PACMAN_TOKEN }}
                  games: 'galaga'

            - name: list generated files
              run: ls -la dist

            - name: push SVGs to the output branch
              run: |
                  cd dist
                  git init -b output
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "Update arcade contribution graphs"
                  git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
